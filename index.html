<html lang="en">

    :root {
      --navy: #061B3A;
      --primary: #4F46E5;

      --section: #F7F8FC;
      --border: #E5EAF3;
      --muted: #5B6B82;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--navy);
      background: var(--white);
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
    }

    .eyebrow {
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 22px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 15px;
      transition: all 0.25s ease;
      border: 1px solid transparent;
    }

    .btn.primary {
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 16px 34px rgba(79,70,229,0.25);
    }

    .btn.secondary {
      background: white;
      color: var(--navy);
      border-color: var(--border);
    }

    .btn:hover {
      transform: translateY(-2px);
    }
