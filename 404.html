</main>
<script>
(function(){
  var trigger = document.querySelector('.services-trigger');
  if(!trigger) return;
  var li = trigger.parentElement;
  var dd = li.querySelector('.dropdown');
  if(!dd) return;

  // Desktop: hover works via CSS focus-within + we add open on click too
  trigger.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    li.classList.toggle('open');
  });

  // Clicks inside dropdown navigate normally — don't close prematurely
  dd.addEventListener('mousedown', function(e){ e.stopPropagation(); });
  dd.addEventListener('click', function(e){ e.stopPropagation(); });

  // Close when clicking outside
  document.addEventListener('click', function(){
    li.classList.remove('open');
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape') li.classList.remove('open');
  });

  // Mobile nav toggle
  var ham = document.getElementById('hamburger');
  var mNav = document.getElementById('mobileNav');
  if(ham && mNav){
    ham.addEventListener('click', function(){
      ham.classList.toggle('open');
      mNav.classList.toggle('open');
      document.body.style.overflow = mNav.classList.contains('open') ? 'hidden' : '';
    });
  }

  // Scroll reveal
  document.documentElement.classList.add('js-loaded');
  var els = document.querySelectorAll('.reveal');
  if('IntersectionObserver' in window){
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('visible'); obs.unobserve(e.target); }});
    },{threshold:0.08,rootMargin:'0px 0px -40px 0px'});
    els.forEach(function(el){ obs.observe(el); });
  } else { els.forEach(function(el){ el.classList.add('visible'); }); }

  // Auto year
  var yr = document.getElementById('yr');
  if(yr) yr.textContent = new Date().getFullYear();
})();
</script>





<!-- CBiz Feedback Widget -->
<style>
#cbfb-btn{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:2147483640;background:#4F46E5;color:#fff;border:none;padding:14px 28px;border-radius:50px;font:700 15px/1 system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 24px rgba(79,70,229,.5);letter-spacing:.02em;transition:background .2s,transform .15s}
#cbfb-btn:hover{background:#3730A3;transform:translateX(-50%) translateY(-2px)}
#cbfb-overlay{display:none;position:fixed;inset:0;z-index:2147483641;background:rgba(79,70,229,.08);cursor:crosshair}
#cbfb-tip{display:none;position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2147483645;background:#3730A3;color:#fff;padding:10px 22px;border-radius:50px;font:600 13px/1 system-ui,sans-serif;pointer-events:none;white-space:nowrap}
.cbfb-hl{outline:3px solid #4F46E5!important;outline-offset:3px!important}
#cbfb-modal{display:none;position:fixed;z-index:2147483646;background:#fff;border-radius:16px;padding:24px;width:320px;box-shadow:0 16px 48px rgba(0,0,0,.2);border:1px solid #E5EAF3}
#cbfb-modal h3{font:700 16px/1 system-ui,sans-serif;color:#061B3A;margin:0 0 6px}
#cbfb-el{font-size:11px;color:#5B6B82;margin:0 0 14px;padding:6px 10px;background:#F7F8FC;border-radius:6px;word-break:break-word}
#cbfb-txt{width:100%;height:100px;border:1.5px solid #E5EAF3;border-radius:8px;padding:10px;font:14px system-ui,sans-serif;color:#061B3A;resize:vertical;outline:none;box-sizing:border-box}
#cbfb-txt:focus{border-color:#4F46E5}
#cbfb-row{display:flex;gap:8px;margin-top:12px}
#cbfb-send{flex:1;background:#4F46E5;color:#fff;border:none;padding:11px;border-radius:8px;font:700 14px system-ui,sans-serif;cursor:pointer}
#cbfb-send:hover{background:#3730A3}
#cbfb-cancel{background:#F7F8FC;color:#5B6B82;border:1px solid #E5EAF3;padding:11px 16px;border-radius:8px;font:600 13px system-ui,sans-serif;cursor:pointer}
</style>


<div id="cbfb-overlay"></div>
<div id="cbfb-tip">Click anything on the page &mdash; press Esc to cancel</div>
<div id="cbfb-modal">

  <p id="cbfb-el"></p>
  <textarea id="cbfb-txt" placeholder="What would you like to change?"></textarea>
  <div id="cbfb-row">
    <button id="cbfb-send">Send</button>
    <button id="cbfb-cancel">Cancel</button>
  </div>
</div>

<script>
(function(){
  var btn=document.getElementById('cbfb-btn');
  var overlay=document.getElementById('cbfb-overlay');
  var tip=document.getElementById('cbfb-tip');
  var modal=document.getElementById('cbfb-modal');
  var elP=document.getElementById('cbfb-el');
  var txt=document.getElementById('cbfb-txt');
  var lastHl=null;
  var picking=false;

  function startPick(){
    picking=true;
    btn.style.display='none';
    overlay.style.display='block';
    tip.style.display='block';
  }

  function stopPick(){
    picking=false;
    btn.style.display='';
    overlay.style.display='none';
    tip.style.display='none';
    if(lastHl){lastHl.classList.remove('cbfb-hl');lastHl=null;}
  }

  function closeModal(){
    modal.style.display='none';
    txt.value='';
    stopPick();
  }

  btn.addEventListener('click',function(e){e.stopPropagation();startPick();});
  document.getElementById('cbfb-cancel').addEventListener('click',closeModal);

  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();}});

  document.addEventListener('mousemove',function(e){
    if(!picking)return;
    var el=document.elementFromPoint(e.clientX,e.clientY);
    if(!el||el===overlay||el===tip)return;
    if(lastHl&&lastHl!==el)lastHl.classList.remove('cbfb-hl');
    lastHl=el;
    el.classList.add('cbfb-hl');
  });

  document.addEventListener('click',function(e){
    if(!picking)return;
    e.preventDefault();e.stopPropagation();
    var el=document.elementFromPoint(e.clientX,e.clientY);
    if(!el||el===overlay)return;
    el.classList.remove('cbfb-hl');
    lastHl=null;
    overlay.style.display='none';
    tip.style.display='none';

    var desc=el.tagName.toLowerCase();
    var content=(el.getAttribute('alt')||el.getAttribute('placeholder')||el.getAttribute('aria-label')||el.textContent||'').trim().replace(/\s+/g,' ').substring(0,80);
    if(content)desc+=' — "'+content+'"';
    elP.textContent=desc;

    var mx=Math.min(e.clientX+16,window.innerWidth-340);
    var my=Math.min(e.clientY+16,window.innerHeight-300);
    modal.style.left=mx+'px';
    modal.style.top=my+'px';
    modal.style.display='block';
    txt.focus();
  },true);

  document.getElementById('cbfb-send').addEventListener('click',function(){
    var val=txt.value.trim();
    if(!val)return;
    var self=this;
    self.textContent='Sending…';self.disabled=true;
    fetch('https://formspree.io/f/xdabwwkq',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({_subject:'[Feedback] '+window.location.pathname,Page:window.location.href,Element:elP.textContent,Feedback:val})
    }).then(function(){
      modal.innerHTML='<div style="text-align:center;padding:12px 0"><div style="font-size:40px;margin-bottom:10px">&#9989;</div><p style="font:700 15px system-ui,sans-serif;color:#061B3A;margin:0 0 4px">Sent!</p><p style="font-size:13px;color:#5B6B82;margin:0">We'll review and make the update.</p></div>';
      setTimeout(function(){closeModal();},2500);
    }).catch(function(){self.textContent='Send';self.disabled=false;alert('Error. Try again.');});
  });
})();
</script>
<!-- End CBiz Feedback Widget -->

</body>
</html>
