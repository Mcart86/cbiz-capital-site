<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Not Found | CBiz Capital</title>
<link rel="icon" href="https://cbizcapital.com/wp-content/uploads/2024/02/Group-1321316416.png" type="image/png" />
<style>
:root{--navy:#061B3A;--primary:#4F46E5;--primary-dark:#3730A3;--light-purple:#EEF0FF;--purple-border:#D8DBFF;--border:#E5EAF3;--muted:#5B6B82}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,sans-serif;color:var(--navy);background:#fff;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
.container{width:min(1180px,calc(100% - 48px));margin:0 auto}
.site-header{background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.header-inner{height:72px;display:flex;align-items:center;justify-content:space-between}
.main{flex:1;display:grid;place-items:center;padding:80px 24px;background:linear-gradient(135deg,var(--navy) 0%,#0D2554 60%,var(--primary-dark) 100%);position:relative;overflow:hidden}
.main::after{content:"";position:absolute;right:-100px;top:-100px;width:500px;height:500px;background:radial-gradient(circle,rgba(79,70,229,.25),transparent 65%);pointer-events:none}
.content{text-align:center;position:relative;z-index:1}
.four04{font-size:clamp(100px,20vw,200px);font-weight:900;line-height:1;color:rgba(255,255,255,.08);letter-spacing:-8px;margin-bottom:-40px}
.content h1{font-size:clamp(32px,4vw,52px);font-weight:900;color:#fff;letter-spacing:-1.5px;margin:0 0 16px}
.content p{font-size:18px;color:rgba(255,255,255,.7);margin:0 0 36px;line-height:1.65}
.btn-group{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:10px;font-weight:700;font-size:15px;border:1.5px solid transparent;transition:all .2s}
.btn.primary{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-dark));box-shadow:0 8px 24px rgba(79,70,229,.4)}
.btn.primary:hover{transform:translateY(-2px)}
.btn.ghost{color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.06)}
.btn.ghost:hover{transform:translateY(-2px);background:rgba(255,255,255,.12)}
</style>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html"><img src="https://cbizcapital.com/wp-content/uploads/2024/02/Group-1321316416.png" alt="CBiz Capital" style="height:38px;width:auto"></a>
  </div>
</header>
<main class="main">
  <div class="content">
    <div class="four04">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <div class="btn-group">
      <a class="btn primary" href="index.html">← Back to Home</a>
      <a class="btn ghost" href="contact.html">Contact Us</a>
    </div>
  </div>
</main>
<script>
(function(){
  var trigger = document.querySelector('.services-trigger');
  if(!trigger) return;
  var li = trigger.parentElement;
  var dd = li.querySelector('.dropdown');
  if(!dd) return;

  // Desktop: hover works via CSS focus-within + we add open on click too
  trigger.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    li.classList.toggle('open');
  });

  // Clicks inside dropdown navigate normally — don't close prematurely
  dd.addEventListener('mousedown', function(e){ e.stopPropagation(); });
  dd.addEventListener('click', function(e){ e.stopPropagation(); });

  // Close when clicking outside
  document.addEventListener('click', function(){
    li.classList.remove('open');
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape') li.classList.remove('open');
  });

  // Mobile nav toggle
  var ham = document.getElementById('hamburger');
  var mNav = document.getElementById('mobileNav');
  if(ham && mNav){
    ham.addEventListener('click', function(){
      ham.classList.toggle('open');
      mNav.classList.toggle('open');
      document.body.style.overflow = mNav.classList.contains('open') ? 'hidden' : '';
    });
  }

  // Scroll reveal
  document.documentElement.classList.add('js-loaded');
  var els = document.querySelectorAll('.reveal');
  if('IntersectionObserver' in window){
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('visible'); obs.unobserve(e.target); }});
    },{threshold:0.08,rootMargin:'0px 0px -40px 0px'});
    els.forEach(function(el){ obs.observe(el); });
  } else { els.forEach(function(el){ el.classList.add('visible'); }); }

  // Auto year
  var yr = document.getElementById('yr');
  if(yr) yr.textContent = new Date().getFullYear();
})();
</script>



<!-- CBiz Feedback Widget -->
<style>
#cbfb-tab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:99999;background:#4F46E5;color:#fff;writing-mode:vertical-rl;padding:14px 10px;font:700 12px/1 'DM Sans',sans-serif;letter-spacing:.08em;cursor:pointer;border-radius:8px 0 0 8px;box-shadow:-3px 0 16px rgba(79,70,229,.3);transition:background .2s;user-select:none;border:none}
#cbfb-tab:hover,#cbfb-tab.active{background:#3730A3}
#cbfb-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:99998;background:#3730A3;color:#fff;text-align:center;padding:10px;font:600 13px 'DM Sans',sans-serif;pointer-events:none}
.cbfb-hl{outline:3px solid #4F46E5!important;outline-offset:3px!important;cursor:crosshair!important}
#cbfb-modal{display:none;position:fixed;z-index:99999;background:#fff;border-radius:16px;padding:22px;width:320px;box-shadow:0 12px 40px rgba(0,0,0,.18);border:1px solid #E5EAF3;font-family:'DM Sans',sans-serif}
#cbfb-modal h3{font:700 15px/1 'Manrope',sans-serif;color:#061B3A;margin:0 0 4px}
#cbfb-modal .cbfb-el{font-size:11px;color:#5B6B82;margin:0 0 14px;word-break:break-word;border-left:3px solid #EEF0FF;padding-left:8px}
#cbfb-modal textarea{width:100%;height:90px;border:1.5px solid #E5EAF3;border-radius:8px;padding:10px;font:14px 'DM Sans',sans-serif;color:#061B3A;resize:vertical;outline:none;box-sizing:border-box;transition:border-color .2s}
#cbfb-modal textarea:focus{border-color:#4F46E5}
#cbfb-modal .cbfb-actions{display:flex;gap:8px;margin-top:10px}
#cbfb-modal .cbfb-send{flex:1;background:#4F46E5;color:#fff;border:none;padding:10px;border-radius:8px;font:700 13px 'DM Sans',sans-serif;cursor:pointer}
#cbfb-modal .cbfb-send:hover{background:#3730A3}
#cbfb-modal .cbfb-cancel{background:#F7F8FC;color:#5B6B82;border:1px solid #E5EAF3;padding:10px 14px;border-radius:8px;font:600 13px 'DM Sans',sans-serif;cursor:pointer}
</style>

<button id="cbfb-tab">Feedback</button>
<div id="cbfb-banner">Click any element on the page to leave feedback &mdash; Press Esc to cancel</div>
<div id="cbfb-modal">
  <h3>Leave Feedback</h3>
  <p class="cbfb-el" id="cbfb-el-desc"></p>
  <textarea id="cbfb-txt" placeholder="What would you like to change?"></textarea>
  <div class="cbfb-actions">
    <button class="cbfb-send" id="cbfb-send">Send</button>
    <button class="cbfb-cancel" id="cbfb-cancel">Cancel</button>
  </div>
</div>

<script>
(function(){
  var tab=document.getElementById('cbfb-tab');
  var banner=document.getElementById('cbfb-banner');
  var modal=document.getElementById('cbfb-modal');
  var elDesc=document.getElementById('cbfb-el-desc');
  var txt=document.getElementById('cbfb-txt');
  var picking=false;
  var currentEl=null;

  function startPicking(){
    picking=true;
    tab.classList.add('active');
    tab.textContent='Cancel';
    banner.style.display='block';
    document.body.style.cursor='crosshair';
  }

  function stopPicking(){
    picking=false;
    tab.classList.remove('active');
    tab.textContent='Feedback';
    banner.style.display='none';
    document.body.style.cursor='';
    if(currentEl){currentEl.classList.remove('cbfb-hl');currentEl=null;}
  }

  function closeModal(){
    modal.style.display='none';
    txt.value='';
    var btn=document.getElementById('cbfb-send');
    btn.textContent='Send';btn.disabled=false;
  }

  tab.onclick=function(){
    if(picking){stopPicking();return;}
    if(modal.style.display==='block'){closeModal();}
    startPicking();
  };

  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){stopPicking();closeModal();}
  });

  document.addEventListener('mouseover',function(e){
    if(!picking)return;
    if(e.target===tab||e.target===banner)return;
    if(currentEl&&currentEl!==e.target)currentEl.classList.remove('cbfb-hl');
    currentEl=e.target;
    currentEl.classList.add('cbfb-hl');
  });

  document.addEventListener('mouseout',function(e){
    if(!picking)return;
    e.target.classList.remove('cbfb-hl');
  });

  document.addEventListener('click',function(e){
    if(!picking)return;
    if(e.target===tab)return;
    e.preventDefault();
    e.stopPropagation();

    var el=e.target;
    el.classList.remove('cbfb-hl');
    stopPicking();

    var desc=el.tagName.toLowerCase();
    var label=el.getAttribute('aria-label')||el.getAttribute('placeholder')||el.getAttribute('alt')||'';
    var content=(label||el.textContent||'').trim().substring(0,80);
    if(content)desc+=': "'+content+'"';

    elDesc.textContent=desc;

    var mx=Math.min(e.clientX+16,window.innerWidth-340);
    var my=Math.min(e.clientY+16,window.innerHeight-280);
    modal.style.left=mx+'px';
    modal.style.top=my+'px';
    modal.style.display='block';
    txt.focus();
  },true);

  document.getElementById('cbfb-cancel').onclick=closeModal;

  document.getElementById('cbfb-send').onclick=function(){
    var val=txt.value.trim();
    if(!val)return;
    var btn=this;
    btn.textContent='Sending…';btn.disabled=true;
    fetch('https://formspree.io/f/xdabwwkq',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({
        _subject:'[Feedback] '+window.location.pathname,
        Page:window.location.href,
        Element:elDesc.textContent,
        Feedback:val
      })
    }).then(function(){
      modal.innerHTML='<div style="text-align:center;padding:8px"><div style="font-size:32px;margin-bottom:8px">&#10003;</div><p style="font:700 14px Manrope,sans-serif;color:#061B3A;margin:0 0 4px">Sent!</p><p style="font-size:13px;color:#5B6B82;margin:0">We'll make the update shortly.</p></div>';
      setTimeout(function(){
        modal.style.display='none';
        modal.innerHTML='<h3>Leave Feedback</h3><p class="cbfb-el" id="cbfb-el-desc"></p><textarea id="cbfb-txt" placeholder="What would you like to change?"></textarea><div class="cbfb-actions"><button class="cbfb-send" id="cbfb-send">Send</button><button class="cbfb-cancel" id="cbfb-cancel">Cancel</button></div>';
        document.getElementById('cbfb-cancel').onclick=closeModal;
        document.getElementById('cbfb-send').onclick=arguments.callee;
        elDesc=document.getElementById('cbfb-el-desc');
        txt=document.getElementById('cbfb-txt');
      },2500);
    }).catch(function(){
      btn.textContent='Send';btn.disabled=false;
      alert('Error sending. Please try again.');
    });
  };
})();
</script>
<!-- End CBiz Feedback Widget -->

</body>
</html>
