<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Not Found | CBiz Capital</title>
<link rel="icon" href="https://cbizcapital.com/wp-content/uploads/2024/02/Group-1321316416.png" type="image/png" />
<style>
:root{--navy:#061B3A;--primary:#4F46E5;--primary-dark:#3730A3;--light-purple:#EEF0FF;--purple-border:#D8DBFF;--border:#E5EAF3;--muted:#5B6B82}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,sans-serif;color:var(--navy);background:#fff;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
.container{width:min(1180px,calc(100% - 48px));margin:0 auto}
.site-header{background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.header-inner{height:72px;display:flex;align-items:center;justify-content:space-between}
.main{flex:1;display:grid;place-items:center;padding:80px 24px;background:linear-gradient(135deg,var(--navy) 0%,#0D2554 60%,var(--primary-dark) 100%);position:relative;overflow:hidden}
.main::after{content:"";position:absolute;right:-100px;top:-100px;width:500px;height:500px;background:radial-gradient(circle,rgba(79,70,229,.25),transparent 65%);pointer-events:none}
.content{text-align:center;position:relative;z-index:1}
.four04{font-size:clamp(100px,20vw,200px);font-weight:900;line-height:1;color:rgba(255,255,255,.08);letter-spacing:-8px;margin-bottom:-40px}
.content h1{font-size:clamp(32px,4vw,52px);font-weight:900;color:#fff;letter-spacing:-1.5px;margin:0 0 16px}
.content p{font-size:18px;color:rgba(255,255,255,.7);margin:0 0 36px;line-height:1.65}
.btn-group{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:10px;font-weight:700;font-size:15px;border:1.5px solid transparent;transition:all .2s}
.btn.primary{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-dark));box-shadow:0 8px 24px rgba(79,70,229,.4)}
.btn.primary:hover{transform:translateY(-2px)}
.btn.ghost{color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.06)}
.btn.ghost:hover{transform:translateY(-2px);background:rgba(255,255,255,.12)}
</style>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html"><img src="https://cbizcapital.com/wp-content/uploads/2024/02/Group-1321316416.png" alt="CBiz Capital" style="height:38px;width:auto"></a>
  </div>
</header>
<main class="main">
  <div class="content">
    <div class="four04">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <div class="btn-group">
      <a class="btn primary" href="index.html">← Back to Home</a>
      <a class="btn ghost" href="contact.html">Contact Us</a>
    </div>
  </div>
</main>
<script>
(function(){
  var trigger = document.querySelector('.services-trigger');
  if(!trigger) return;
  var li = trigger.parentElement;
  var dd = li.querySelector('.dropdown');
  if(!dd) return;

  // Desktop: hover works via CSS focus-within + we add open on click too
  trigger.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    li.classList.toggle('open');
  });

  // Clicks inside dropdown navigate normally — don't close prematurely
  dd.addEventListener('mousedown', function(e){ e.stopPropagation(); });
  dd.addEventListener('click', function(e){ e.stopPropagation(); });

  // Close when clicking outside
  document.addEventListener('click', function(){
    li.classList.remove('open');
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape') li.classList.remove('open');
  });

  // Mobile nav toggle
  var ham = document.getElementById('hamburger');
  var mNav = document.getElementById('mobileNav');
  if(ham && mNav){
    ham.addEventListener('click', function(){
      ham.classList.toggle('open');
      mNav.classList.toggle('open');
      document.body.style.overflow = mNav.classList.contains('open') ? 'hidden' : '';
    });
  }

  // Scroll reveal
  document.documentElement.classList.add('js-loaded');
  var els = document.querySelectorAll('.reveal');
  if('IntersectionObserver' in window){
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('visible'); obs.unobserve(e.target); }});
    },{threshold:0.08,rootMargin:'0px 0px -40px 0px'});
    els.forEach(function(el){ obs.observe(el); });
  } else { els.forEach(function(el){ el.classList.add('visible'); }); }

  // Auto year
  var yr = document.getElementById('yr');
  if(yr) yr.textContent = new Date().getFullYear();
})();
</script>

<!-- CBiz Feedback Widget -->
<style>
#cbiz-fb-tab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:99999;background:#4F46E5;color:#fff;writing-mode:vertical-rl;text-orientation:mixed;padding:14px 10px;font:700 12px/1 'DM Sans',sans-serif;letter-spacing:.08em;cursor:pointer;border-radius:8px 0 0 8px;box-shadow:-3px 0 16px rgba(79,70,229,.3);transition:background .2s;user-select:none}
#cbiz-fb-tab:hover{background:#3730A3}
#cbiz-fb-panel{position:fixed;right:-380px;top:50%;transform:translateY(-50%);z-index:99998;width:340px;background:#fff;border-radius:16px 0 0 16px;box-shadow:-8px 0 40px rgba(0,0,0,.15);padding:24px;transition:right .3s cubic-bezier(.4,0,.2,1);border:1px solid #E5EAF3;border-right:none}
#cbiz-fb-panel.open{right:0}
#cbiz-fb-panel h3{font:700 16px/1 'Manrope',sans-serif;color:#061B3A;margin:0 0 4px}
#cbiz-fb-panel p{font-size:12px;color:#5B6B82;margin:0 0 16px}
#cbiz-fb-panel label{display:block;font-size:12px;font-weight:600;color:#061B3A;margin-bottom:5px}
#cbiz-fb-panel select,#cbiz-fb-panel textarea{width:100%;border:1.5px solid #E5EAF3;border-radius:8px;padding:9px 11px;font:14px 'DM Sans',sans-serif;color:#061B3A;outline:none;box-sizing:border-box;transition:border-color .2s}
#cbiz-fb-panel select:focus,#cbiz-fb-panel textarea:focus{border-color:#4F46E5}
#cbiz-fb-panel textarea{height:100px;resize:vertical;margin-bottom:12px}
#cbiz-fb-panel select{margin-bottom:12px}
#cbiz-fb-send{width:100%;background:#4F46E5;color:#fff;border:none;padding:11px;border-radius:8px;font:700 14px 'DM Sans',sans-serif;cursor:pointer;transition:background .2s}
#cbiz-fb-send:hover{background:#3730A3}
#cbiz-fb-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:#5B6B82;cursor:pointer;line-height:1}
#cbiz-fb-success{display:none;text-align:center;padding:16px 0}
#cbiz-fb-success div{font-size:36px;margin-bottom:8px}
#cbiz-fb-success p{font-size:14px;color:#5B6B82;margin:0}
</style>
<div id="cbiz-fb-tab">Feedback</div>
<div id="cbiz-fb-panel">
  <button id="cbiz-fb-close" onclick="document.getElementById('cbiz-fb-panel').classList.remove('open')">&times;</button>
  <h3>Leave Feedback</h3>
  <p id="cbiz-fb-page-label">Page: <span id="cbiz-fb-pagename"></span></p>
  <div id="cbiz-fb-form">
    <label>Type of feedback</label>
    <select id="cbiz-fb-type">
      <option value="Content change">Content change</option>
      <option value="Design issue">Design issue</option>
      <option value="Wrong information">Wrong information</option>
      <option value="Add something">Add something</option>
      <option value="Other">Other</option>
    </select>
    <label>Your feedback</label>
    <textarea id="cbiz-fb-text" placeholder="Describe what you'd like changed or added..."></textarea>
    <button id="cbiz-fb-send">Send Feedback</button>
  </div>
  <div id="cbiz-fb-success">
    <div>&#10003;</div>
    <p><strong>Got it!</strong><br>We'll make the update shortly.</p>
  </div>
</div>
<script>
(function(){
  var tab=document.getElementById('cbiz-fb-tab');
  var panel=document.getElementById('cbiz-fb-panel');
  var pagename=document.getElementById('cbiz-fb-pagename');
  pagename.textContent=window.location.pathname||'/';
  tab.onclick=function(){panel.classList.toggle('open');};
  document.getElementById('cbiz-fb-send').onclick=function(){
    var txt=document.getElementById('cbiz-fb-text').value.trim();
    var type=document.getElementById('cbiz-fb-type').value;
    if(!txt)return;
    var btn=document.getElementById('cbiz-fb-send');
    btn.textContent='Sending…';btn.disabled=true;
    fetch('https://formspree.io/f/xdabwwkq',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({
        _subject:'[Site Feedback] '+window.location.pathname,
        Page:window.location.href,
        Type:type,
        Feedback:txt
      })
    }).then(function(){
      document.getElementById('cbiz-fb-form').style.display='none';
      document.getElementById('cbiz-fb-success').style.display='block';
      setTimeout(function(){
        panel.classList.remove('open');
        setTimeout(function(){
          document.getElementById('cbiz-fb-form').style.display='block';
          document.getElementById('cbiz-fb-success').style.display='none';
          document.getElementById('cbiz-fb-text').value='';
          btn.textContent='Send Feedback';btn.disabled=false;
        },400);
      },2500);
    }).catch(function(){
      btn.textContent='Send Feedback';btn.disabled=false;
      alert('Error sending. Please try again.');
    });
  };
})();
</script>
<!-- End CBiz Feedback Widget -->

</body>
