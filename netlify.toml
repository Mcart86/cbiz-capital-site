  force = true

[[redirects]]
  from = "/builders-risk-insurance.html"
  to = "/builders-risk-insurance"
  status = 301
  force = true

# Rewrites - serve the actual .html file content at the clean URL (200, not a redirect)
# These must come AFTER the .html->clean 301 rules above, and BEFORE the catch-all 404 rule.
[[redirects]]
  from = "/dscr-rental-loans"
  to = "/dscr-rental-loans.html"
  status = 200

[[redirects]]
  from = "/fix-and-flip"
  to = "/fix-and-flip.html"
