# Build settings
[build]
  publish = "."
  command = "echo 'No build required'"

# Asset optimization
[context.production]
  # Enable clean URLs
  command = "echo 'Production build'"

# Redirects - handle HTML extension cleanup
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/dscr-rental-loans.html"
  to = "/dscr-rental-loans"
  status = 301
  force = true

[[redirects]]
  from = "/fix-and-flip.html"
  to = "/fix-and-flip"
  status = 301
  force = true

[[redirects]]
  from = "/bridge-loans.html"
  to = "/bridge-loans"
  status = 301
  force = true

[[redirects]]
  from = "/multifamily-loans.html"
  to = "/multifamily-loans"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/blogs.html"
  to = "/blogs"
  status = 301
  force = true

[[redirects]]
  from = "/faqs.html"
  to = "/faqs"
  status = 301
  force = true

[[redirects]]
